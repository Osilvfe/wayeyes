[package]
name = "wayeyes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "xeyes reimagined for Wayland"
license = "MIT"
repository = "https://github.com/Osilvfe/wayeyes"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk = { package = "gtk4", version = "0.10" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "symbols"
